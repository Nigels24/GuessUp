<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 202" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="320" height="202" rx="14" fill="#1E1B3A"/><circle cx="20" cy="18" r="5" fill="#FF5F57"/><circle cx="36" cy="18" r="5" fill="#FEBC2E"/><circle cx="52" cy="18" r="5" fill="#28C840"/><text x="300" y="22" font-size="11" fill="#A5A0D0" text-anchor="end" font-weight="400">Count.java</text><text x="18" y="54" font-size="14" fill="#E9E6FF" font-family="Consolas, Menlo, monospace" xml:space="preserve">int n = 10, c = 0;</text><text x="18" y="78" font-size="14" fill="#E9E6FF" font-family="Consolas, Menlo, monospace" xml:space="preserve">while (n &gt; 1) {</text><text x="18" y="102" font-size="14" fill="#E9E6FF" font-family="Consolas, Menlo, monospace" xml:space="preserve">    n = n / 2;</text><text x="18" y="126" font-size="14" fill="#E9E6FF" font-family="Consolas, Menlo, monospace" xml:space="preserve">    c++;</text><text x="18" y="150" font-size="14" fill="#E9E6FF" font-family="Consolas, Menlo, monospace" xml:space="preserve">}</text><text x="18" y="174" font-size="14" fill="#E9E6FF" font-family="Consolas, Menlo, monospace" xml:space="preserve">System.out.println(c);</text></svg>
<script>

                   'puzzle'  – rebuild the answer from scrambled letters

     code        : (optional) code snippet shown under the question
     image       : picture items only — 'svg:<name>' from images.js, or an image URL
     answer      : the correct answer
     alternates  : (optional) other accepted typed answers
     choices     : mc only — exactly 3 wrong options
     hint        : partial clue (costs points; none on Difficult)
     explanation : shown after the student answers
     topic       : used in "most missed topics" reports

   ===================================================================== */

<script>
/* =====================================================================
   GuessUp Prototype — PICTURE LIBRARY (editable)
   Picture items use image: 'svg:<name>'. Add your own drawing here, or
   upload a real image from the Admin Panel > Questions form instead.

(function () {
  const INK = '#2B2060', P = '#6C4CF1', LAV = '#EDE9FE', Y = '#FFC83D', G = '#22C55E', B = '#0EA5E9', PK = '#EC4899', GR = '#94A3B8', R = '#EF4444';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const svg = (body, w = 320, h = 200, bg = '#F8F7FF') =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" font-family="Arial, Helvetica, sans-serif"><rect width="${w}" height="${h}" rx="14" fill="${bg}"/>${body}</svg>`;
  const txt = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 13}" fill="${o.fill || INK}" text-anchor="${o.anchor || 'middle'}" font-weight="${o.weight || 700}"${o.mono ? ' font-family="Consolas, Menlo, monospace"' : ''}>${esc(t)}</text>`;
  const node = (x, y, label, fill = LAV) => `<circle cx="${x}" cy="${y}" r="15" fill="${fill}" stroke="${INK}" stroke-width="2.5"/>${label ? txt(x, y + 5, label, { size: 13 }) : ''}`;
  const pc = (x, y) => `<rect x="${x - 14}" y="${y - 11}" width="28" height="19" rx="3" fill="${LAV}" stroke="${INK}" stroke-width="2.5"/><rect x="${x - 6}" y="${y + 8}" width="12" height="4" fill="${INK}"/>`;
  const line = (x1, y1, x2, y2, c = INK, w = 2.5) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const arrowDefs = `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${INK}"/></marker></defs>`;
  const arrow = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="2.5" marker-end="url(#ar)"/>`;

  // Dark "code editor" picture
  function code(lines, file) {
    const h = 58 + lines.length * 24;
    let body = `<rect width="320" height="${h}" rx="14" fill="#1E1B3A"/><circle cx="20" cy="18" r="5" fill="#FF5F57"/><circle cx="36" cy="18" r="5" fill="#FEBC2E"/><circle cx="52" cy="18" r="5" fill="#28C840"/>${txt(300, 22, file, { size: 11, fill: '#A5A0D0', anchor: 'end', weight: 400 })}`;
    lines.forEach((l, i) => {
      body += `<text x="18" y="${54 + i * 24}" font-size="14" fill="#E9E6FF" font-family="Consolas, Menlo, monospace" xml:space="preserve">${esc(l)}</text>`;
    });
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 ${h}">${body}</svg>`;
  }

  const I = {};

  I.flow_decision = svg(`${arrowDefs}
    ${arrow(160, 12, 160, 42)}
    <polygon points="160,44 230,100 160,156 90,100" fill="${Y}" stroke="${INK}" stroke-width="3"/>
    ${txt(160, 105, 'score ≥ 75 ?', { size: 14 })}
    ${arrow(230, 100, 290, 100)}${txt(262, 92, 'Yes', { size: 12 })}
    ${arrow(160, 156, 160, 190)}${txt(176, 178, 'No', { size: 12, anchor: 'start' })}`);

  I.flow_io = svg(`${arrowDefs}
    ${arrow(160, 14, 160, 58)}
    <polygon points="95,60 265,60 225,140 55,140" fill="${B}" fill-opacity=".25" stroke="${INK}" stroke-width="3"/>
    ${txt(160, 106, 'Read age', { size: 16 })}
    ${arrow(160, 140, 160, 186)}`);

  I.code_loop = code(['for (int i = 0; i < 3; i++) {', '    System.out.print(i);', '}'], 'Loop.java');
  I.code_while = code(['int n = 10, c = 0;', 'while (n > 1) {', '    n = n / 2;', '    c++;', '}', 'System.out.println(c);'], 'Count.java');
  I.js_code = code(['let a = [1, 2, 3];', 'let b = a;', 'b.push(4);', 'console.log(a.length);'], 'app.js');
  I.html_anchor = code(['<p>Visit our school:', '  <a href="https://jhcsc.edu.ph">', '     JHCSC Website', '  </a>', '</p>'], 'index.html');

<style>
/* =====================================================================
   GuessUp Prototype — STYLES

:root {

/* ---------- buttons & inputs ---------- */
.btn {

/* ---------- toast & modal ---------- */
.toast-wrap { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }

@keyframes fadeIn { from { opacity: 0; } }

.bottom-nav a.active { background: var(--brand-soft); color: var(--brand-dark); }
.bottom-nav a.active .ic { filter: none; opacity: 1; }

/* auth screens */
.auth { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 8px 4px; }
.auth-hero { text-align: center; margin-bottom: 22px; }
.auth-hero .logo-mark { margin: 0 auto 14px; width: 72px; height: 72px; font-size: 38px; border-radius: 22px; }
.auth-hero h1 { font-size: 34px; color: var(--brand-dark); }
.auth-card { background: #fff; border-radius: 24px; padding: 20px; box-shadow: var(--shadow); }
.demo-chip { margin-top: 14px; width: 100%; background: var(--warn-soft); border: 2px dashed #F2C66B; border-radius: 14px; padding: 10px 12px; font-size: 13px; text-align: left; cursor: pointer; color: var(--ink); }
.auth-alt { text-align: center; margin-top: 16px; font-size: 14px; }
.auth-alt a { font-weight: 800; text-decoration: none; }
.pw-wrap { position: relative; }
.pw-wrap .icon-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 13px; width: auto; padding: 0 8px; font-weight: 800; color: var(--brand); }

/* home */
.hello { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 16px; }
.hello h2 { font-size: 24px; }
.avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); font-size: 17px; flex-shrink: 0; }
.avatar-lg { width: 84px; height: 84px; border-radius: 28px; font-size: 32px; }
.hero-card { background: linear-gradient(135deg, #6C4CF1, #9B6BFF); color: #fff; border-radius: 24px; padding: 18px; position: relative; overflow: hidden; box-shadow: 0 10px 24px rgba(108, 76, 241, .35); }
.hero-card::after { content: '?'; position: absolute; right: -8px; bottom: -40px; font-family: var(--font-display); font-size: 160px; font-weight: 700; opacity: .13; }
.hero-stats { display: flex; gap: 10px; margin-top: 14px; }
.hero-stats div { flex: 1; background: rgba(255, 255, 255, .16); border-radius: 14px; padding: 9px 10px; }
.hero-stats b { display: block; font-family: var(--font-display); font-size: 20px; }
.hero-stats span { font-size: 11px; opacity: .85; font-weight: 700; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 10px; }
.section-title h3 { font-size: 18px; }
.section-title a { font-size: 13px; font-weight: 800; text-decoration: none; }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cat-card { background: #fff; border-radius: 20px; padding: 14px; text-align: left; border: 0; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; min-height: 138px; position: relative; overflow: hidden; transition: transform .12s; color: var(--ink); }
.cat-card:hover { transform: translateY(-2px); }
.cat-card:active { transform: scale(.98); }
.cat-card .cat-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; }
.cat-card h4 { font-size: 14.5px; line-height: 1.2; font-family: var(--font); font-weight: 800; }
.cat-card .meta { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-top: auto; }
.meter { height: 7px; background: #EEEBFA; border-radius: 9px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 9px; background: var(--brand); }

/* level sheet */
.level-opt { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; border: 2px solid var(--line); background: #fff; cursor: pointer; margin-bottom: 10px; text-align: left; color: var(--ink); }
.level-opt:hover { border-color: #CFC7F7; }
.level-opt.selected { border-color: var(--brand); background: var(--brand-soft); }
.level-dot { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
.level-opt b { display: block; font-size: 16px; }
.level-opt small { color: var(--muted); font-weight: 700; }
.level-rules { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }

/* play */
.play-top { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
.play-top .progress { flex: 1; display: flex; gap: 5px; }
.play-top .progress i { flex: 1; height: 8px; border-radius: 9px; background: #E4E0F6; }
.play-top .progress i.done-ok { background: var(--ok); }
.play-top .progress i.done-bad { background: var(--bad); }
.play-top .progress i.now { background: var(--brand); }
.score-chip { background: var(--accent); border-radius: 12px; padding: 5px 10px; font-weight: 800; font-size: 14px; white-space: nowrap; }
.timer { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.timer-bar { flex: 1; height: 12px; background: #E4E0F6; border-radius: 12px; overflow: hidden; }
.timer-bar i { display: block; height: 100%; background: var(--ok); border-radius: 12px; transition: background .3s; }
.timer.warn .timer-bar i { background: var(--warn); }
.timer.danger .timer-bar i { background: var(--bad); }
.timer-num { font-family: var(--font-display); font-weight: 700; font-size: 20px; width: 44px; text-align: right; }
.timer.danger .timer-num { color: var(--bad); animation: pulse .6s infinite alternate; }
@keyframes pulse { to { transform: scale(1.12); } }
.q-card { background: #fff; border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }
.q-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.q-text { font-size: 18px; font-weight: 800; line-height: 1.35; }
.q-code { background: #1E1B3A; color: #EDEAFF; border-radius: 14px; padding: 12px 14px; margin-top: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.q-img { margin-top: 12px; border-radius: 16px; overflow: hidden; background: #F8F7FF; border: 2px solid var(--line); }
.q-img img { display: block; width: 100%; height: auto; max-height: 240px; object-fit: contain; }
.hint-box { margin-top: 12px; background: var(--warn-soft); border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 700; color: #92400E; animation: popIn .2s; }
.choices { display: grid; gap: 10px; margin-top: 14px; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: 16px; border: 2px solid var(--line); background: #fff; font-size: 15px; font-weight: 800; text-align: left; cursor: pointer; color: var(--ink); box-shadow: 0 3px 0 var(--line); transition: transform .08s; }
.choice:hover:not(:disabled) { border-color: #CFC7F7; }
.choice:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.choice .key { width: 30px; height: 30px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-dark); display: grid; place-items: center; font-size: 13px; flex-shrink: 0; }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 #86EFAC; }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 #FCA5A5; }
.choice:disabled { cursor: default; }
.answer-row { display: flex; gap: 8px; margin-top: 14px; }
.answer-row .input { font-size: 17px; font-weight: 700; }
.slots { display: flex; flex-wrap: wrap; gap: 14px 6px; justify-content: center; margin: 16px 0 6px; }
.slot-word { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.slot { width: 34px; height: 42px; border-radius: 11px; border: 2px dashed #CFC7F7; background: #FBFAFF; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; cursor: pointer; color: var(--ink); padding: 0; }
.slot.filled { border-style: solid; border-color: var(--brand); background: var(--brand-soft); }
.tiles { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 12px; }
.tile { width: 40px; height: 44px; border-radius: 12px; border: 0; background: var(--accent); box-shadow: 0 4px 0 #D9A21C; font-family: var(--font-display); font-weight: 700; font-size: 20px; cursor: pointer; color: var(--ink); }
.tile:active { transform: translateY(3px); box-shadow: none; }
.tile.used { visibility: hidden; }
.play-actions { display: flex; gap: 10px; margin-top: 16px; }
.play-actions .btn { flex: 1; }
.feedback { text-align: center; }
.fb-icon { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; margin: 4px auto 10px; }
.fb-ok .fb-icon { background: var(--ok-soft); }
.fb-bad .fb-icon { background: var(--bad-soft); }
.fb-title { font-size: 26px; }
.fb-ok .fb-title { color: var(--ok); }
.fb-bad .fb-title { color: var(--bad); }
.fb-answer { margin: 12px 0; background: var(--bg); border-radius: 14px; padding: 12px; font-size: 14px; text-align: left; }
.fb-answer b { font-size: 16px; }
.fb-expl { font-size: 14px; color: var(--ink-2); text-align: left; }
.fb-points { display: inline-block; margin-top: 4px; font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--brand-dark); }

/* result */
.result-hero { text-align: center; padding: 10px 0 4px; position: relative; }
.result-hero .trophy { font-size: 64px; animation: bounce 1s ease; display: inline-block; }
@keyframes bounce { 0% { transform: scale(.3); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.big-score { font-family: var(--font-display); font-size: 58px; font-weight: 700; color: var(--brand-dark); line-height: 1; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.stat { background: #fff; border-radius: 16px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-size: 22px; }
.stat span { font-size: 11.5px; color: var(--muted); font-weight: 800; }
.review-item { display: flex; gap: 10px; background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); font-size: 13.5px; }
.review-item .ri-ic { font-size: 18px; }
.new-badge { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #FFF7DB, #FFE9A8); border-radius: 18px; padding: 12px 14px; margin-bottom: 8px; animation: popIn .4s; }
.new-badge .bi { font-size: 32px; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(900px) rotate(720deg); } }

/* leaderboard */
.chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; margin: 0 -18px; padding-left: 18px; padding-right: 18px; }
.chip-row::-webkit-scrollbar { display: none; }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 7px 12px; font-weight: 800; font-size: 13px; white-space: nowrap; cursor: pointer; color: var(--ink-2); }
.chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 8px; margin: 14px 0 16px; }
.pod { text-align: center; }
.pod .avatar { margin: 0 auto 6px; }
.pod .name { font-size: 12.5px; font-weight: 800; line-height: 1.2; min-height: 30px; }
.pod .base { border-radius: 16px 16px 8px 8px; color: #fff; font-family: var(--font-display); font-weight: 700; padding: 10px 0; margin-top: 6px; }
.pod-1 .base { background: linear-gradient(#FFC83D, #F59E0B); height: 96px; font-size: 30px; }
.pod-2 .base { background: linear-gradient(#A5B4FC, #818CF8); height: 72px; font-size: 24px; }
.pod-3 .base { background: linear-gradient(#FDBA74, #FB923C); height: 56px; font-size: 22px; }
.pod .pts { font-size: 12px; font-weight: 800; color: var(--muted); }
.lb-row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.lb-row.me { outline: 3px solid var(--brand); }
.lb-rank { width: 26px; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--muted); text-align: center; }
.lb-row .avatar { width: 38px; height: 38px; font-size: 14px; border-radius: 12px; }
.lb-name { flex: 1; min-width: 0; }
.lb-name b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-name span { font-size: 12px; color: var(--muted); font-weight: 700; }
.lb-pts { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--brand-dark); }

/* progress & profile */
.card { background: #fff; border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.cat-line { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.cat-line + .cat-line { border-top: 1px solid var(--line); }
.cat-line .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
.cat-line .body { flex: 1; min-width: 0; }

.cat-line .val { font-weight: 800; font-size: 13px; width: 42px; text-align: right; }

.hist-row .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; flex-shrink: 0; }
.hist-row .body { flex: 1; min-width: 0; font-size: 13px; }
.hist-row .body b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-row .sc { text-align: right; font-weight: 800; }
.badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { background: #fff; border-radius: 18px; padding: 12px 6px; text-align: center; box-shadow: var(--shadow); cursor: pointer; border: 0; color: var(--ink); }
.badge .bi { font-size: 32px; display: block; }
.badge b { font-size: 12px; display: block; margin-top: 4px; line-height: 1.2; }
.badge.locked .bi { filter: grayscale(1); opacity: .3; }
.badge.locked b { color: var(--muted); }
.profile-head { text-align: center; padding: 10px 0 6px; }
.profile-head .avatar { margin: 0 auto 10px; }
.menu-list { background: #fff; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.menu-list button, .menu-list a { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 0; background: none; font-size: 15px; font-weight: 800; color: var(--ink); cursor: pointer; text-decoration: none; text-align: left; }
.menu-list > * + * { border-top: 1px solid var(--line); }
.menu-list .danger { color: var(--bad); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); font-weight: 700; }
.empty .e-ic { font-size: 40px; display: block; margin-bottom: 6px; }
.topbar-s { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.topbar-s h2 { font-size: 24px; flex: 1; }

/* =====================================================================
   ADMIN WEB PANEL
   ===================================================================== */
.admin { display: flex; min-height: 100vh; background: #F5F4FB; }
.sidebar { width: 248px; flex-shrink: 0; background: #1B1442; color: #CFC9F2; display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
.side-logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; color: #fff; }

.side-nav { display: flex; flex-direction: column; gap: 3px; }
.side-nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: #CFC9F2; text-decoration: none; font-weight: 700; font-size: 14.5px; }

.menu-toggle { display: none; }
.content { padding: 24px 28px 40px; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }

.tiles-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: #fff; border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
.kpi .k-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
.kpi b { font-family: var(--font-display); font-size: 26px; display: block; line-height: 1.1; }
.kpi span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
.panel { background: #fff; border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 8px; flex-wrap: wrap; }

.panel-body { padding: 8px 18px 18px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.toolbar .input { width: auto; padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.toolbar .search { flex: 1; min-width: 180px; }
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 800; padding: 11px 14px; background: #FAF9FE; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }

.user-cell { display: flex; align-items: center; gap: 10px; }

.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 170px 1fr 48px; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; }

.bar-track { height: 14px; background: #F0EEF9; border-radius: 8px; overflow: hidden; }

.bar-row .v { text-align: right; }
.cols { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
.cols .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.cols .col i { width: 100%; max-width: 28px; background: var(--brand); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.cols .col span { font-size: 10px; color: var(--muted); font-weight: 700; }
.cols .col em { font-style: normal; font-size: 10.5px; font-weight: 800; color: var(--ink-2); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-grid .full { grid-column: 1 / -1; }
.img-drop { border: 2px dashed #CFC7F7; border-radius: 14px; padding: 14px; text-align: center; background: #FBFAFF; }
.img-drop img { max-height: 140px; border-radius: 10px; display: block; margin: 0 auto 8px; }
.toggle { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: #CBD5E1; border-radius: 24px; cursor: pointer; transition: .2s; }
.toggle span::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }

.cat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.cat-admin { background: #fff; border-radius: 18px; padding: 16px; box-shadow: var(--shadow); border-top: 5px solid; display: flex; flex-direction: column; gap: 8px; }
.cat-admin .top { display: flex; align-items: center; gap: 10px; }

<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Please enable JavaScript to use the GuessUp prototype.</p></noscript>

<!-- ===================== [5] APP CODE ===================== -->
<script>
/* =====================================================================
   GuessUp Prototype — CORE (data store, auth, game rules, helpers)
   Simulates the NestJS API + PostgreSQL database in the browser.
   ===================================================================== */
(function () {
  const SEED = window.GU_SEED;
  const CFG = SEED.config;
  const DB_KEY = 'guessup_prototype_db';
  const AUTH_KEY = 'guessup_prototype_auth_';

  /* ---------- safe storage (falls back to memory) ---------- */
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
  };

  /* ---------- small utils ---------- */
  const clone = o => JSON.parse(JSON.stringify(o));
  const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const DAY = 86400000;
  function prng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const escHtml = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  /* ---------- game rules ---------- */
  function scoreAnswer(level, correct, remaining, hintUsed) {
    if (!correct) return 0;
    const L = CFG.levels[level];
    const bonus = Math.round(L.points * CFG.speedBonus * Math.max(0, remaining) / L.seconds);
    return Math.max(1, L.points + bonus - (hintUsed ? L.hintPenalty : 0));
  }
  function checkAnswer(q, submitted) {
    if (submitted == null || submitted === '') return false;
    if (q.type === 'mc') return String(submitted) === String(q.answer);
    const s = norm(submitted);
    if (!s) return false;
    return [q.answer].concat(q.alternates || []).some(a => norm(a) === s);
  }

  /* ---------- seed / load ---------- */
  function buildSeed() {
    const now = Date.now();
    const db = {
      version: CFG.dataVersion,
      categories: clone(SEED.categories),
      questions: SEED.questions.map((q, i) => Object.assign({
        id: 'q' + String(i + 1).padStart(3, '0'),
        image: '', code: '', alternates: [], choices: [], hint: '', explanation: '', topic: '',
        active: true, createdAt: new Date(now - 45 * DAY).toISOString()
      }, clone(q), { categoryId: q.category || q.categoryId })),
      users: SEED.users.map((u, i) => Object.assign({
        id: 'u' + (i + 1), status: 'active', badges: [], yearLevel: '',
        createdAt: new Date(now - (60 - i * 3) * DAY).toISOString()
      }, clone(u))),
      sessions: [],
      answers: []
    };
    db.questions.forEach(q => delete q.category);
    if (CFG.generateMockActivity) generateMockActivity(db);
    return db;
  }

  function generateMockActivity(db) {
    const rnd = prng(20260821);
    const levels = Object.keys(CFG.levels);
    const students = db.users.filter(u => u.role === 'student');
    const now = Date.now();
    students.forEach((u, idx) => {
      const skill = 0.45 + rnd() * 0.45;
      const rounds = u.id === 'demo' ? 4 : 4 + Math.floor(rnd() * 12);
      const favs = shuffle(db.categories.map(c => c.id), rnd).slice(0, 3 + Math.floor(rnd() * 4));
      const events = [];
      for (let r = 0; r < rounds; r++) events.push(now - (1 + rnd() * 29) * DAY);
      events.sort((a, b) => a - b).forEach(t => {
        const cat = favs[Math.floor(rnd() * favs.length)];
        const level = levels[Math.min(2, Math.floor(rnd() * (1 + skill * 3)))];
        const items = pickRound(db, cat, level, rnd);
        if (!items.length) return;
        const L = CFG.levels[level];
        const sessionId = 'ses_m' + idx + '_' + Math.floor(t);
        let elapsed = 0;
        const answers = items.map(q => {
          const hard = (q.id.charCodeAt(q.id.length - 1) % 4 === 0) ? 0.25 : 0; // some items are commonly missed
          const pCorrect = skill - (level === 'difficult' ? 0.18 : level === 'average' ? 0.08 : 0) - hard;
          const correct = rnd() < pCorrect;
          const hintUsed = L.hints > 0 && rnd() < 0.2;
          const timeTaken = Math.max(2, Math.round(L.seconds * (0.15 + rnd() * 0.7)));
          elapsed += timeTaken;
          return {
            id: uid('ans'), sessionId, questionId: q.id, submitted: correct ? q.answer : '—',
            correct, hintUsed, timeTaken, points: scoreAnswer(level, correct, L.seconds - timeTaken, hintUsed)
          };
        });
        const correctCount = answers.filter(a => a.correct).length;
        db.sessions.push({
          id: sessionId, userId: u.id, categoryId: cat, difficulty: level,
          startedAt: new Date(t).toISOString(), endedAt: new Date(t + elapsed * 1000).toISOString(),
          totalScore: answers.reduce((s, a) => s + a.points, 0),
          correct: correctCount, total: answers.length,
          accuracy: Math.round(correctCount / answers.length * 100),
          timeSpent: elapsed, hintsUsed: answers.filter(a => a.hintUsed).length, status: 'completed'
        });
        db.answers.push(...answers);
      });
      evaluateBadges(db, u, true);
    });
  }

  function load() {
    const raw = store.get(DB_KEY);
    if (raw) {
      try { const d = JSON.parse(raw); if (d && d.version === CFG.dataVersion) return d; } catch (e) { /* ignore */ }
    }
    const d = buildSeed();
    store.set(DB_KEY, JSON.stringify(d));
    return d;
  }

  let db = load();
  function save() {
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
    catch (e) {
      mem[DB_KEY] = JSON.stringify(db);
      if (e && e.name === 'QuotaExceededError') GU.ui.toast('Browser storage is full. Remove some uploaded images.', 'error');
      return false;
    }
  }
  function reset() {
    store.del(DB_KEY); store.del(AUTH_KEY + 'student'); store.del(AUTH_KEY + 'admin');
    db = buildSeed(); save();
  }

  /* ---------- queries ---------- */
  const q = {
    category: id => db.categories.find(c => c.id === id),
    question: id => db.questions.find(x => x.id === id),
    user: id => db.users.find(u => u.id === id),
    session: id => db.sessions.find(s => s.id === id),
    students: () => db.users.filter(u => u.role === 'student'),
    sessionsOf: uidv => db.sessions.filter(s => s.userId === uidv).sort((a, b) => b.startedAt.localeCompare(a.startedAt)),
    answersOf: sid => db.answers.filter(a => a.sessionId === sid),
    answersOfUser: uidv => { const ids = new Set(db.sessions.filter(s => s.userId === uidv).map(s => s.id)); return db.answers.filter(a => ids.has(a.sessionId)); },
    questionsIn: cid => db.questions.filter(x => x.categoryId === cid)
  };

  function pickRound(d, catId, level, rnd = Math.random) {
    const pool = d.questions.filter(x => x.categoryId === catId && x.active !== false);
    const exact = shuffle(pool.filter(x => x.difficulty === level), rnd);
    const rest = shuffle(pool.filter(x => x.difficulty !== level), rnd);
    return exact.concat(rest).slice(0, CFG.roundSize);
  }

  /* ---------- badges ---------- */
  function statsFor(d, u) {
    const sessions = d.sessions.filter(s => s.userId === u.id);
    const ids = new Set(sessions.map(s => s.id));
    const answers = d.answers.filter(a => ids.has(a.sessionId));
    return { sessions, answers, categories: new Set(sessions.map(s => s.categoryId)).size };
  }
  function evaluateBadges(d, u, silent) {
    const s = statsFor(d, u);
    const have = new Set((u.badges || []).map(b => b.id));
    const earned = [];
    SEED.badges.forEach(b => {
      let ok = false; try { ok = !!b.rule(s); } catch (e) { ok = false; }
      if (ok && !have.has(b.id)) {
        const at = silent && s.sessions.length ? s.sessions[s.sessions.length - 1].endedAt : new Date().toISOString();
        u.badges.push({ id: b.id, at }); earned.push(b);
      }
    });
    return earned;
  }

  /* ---------- leaderboard / stats ---------- */
  function leaderboard(catId) {
    const map = {};
    db.sessions.forEach(s => {
      if (catId && catId !== 'all' && s.categoryId !== catId) return;
      const u = q.user(s.userId);
      if (!u || u.role !== 'student' || u.status !== 'active') return;
      const m = map[u.id] || (map[u.id] = { user: u, points: 0, rounds: 0, correct: 0, total: 0 });
      m.points += s.totalScore; m.rounds++; m.correct += s.correct; m.total += s.total;
    });
    return Object.values(map)
      .map(m => Object.assign(m, { accuracy: m.total ? Math.round(m.correct / m.total * 100) : 0 }))
      .sort((a, b) => b.points - a.points || b.accuracy - a.accuracy)
      .map((m, i) => Object.assign(m, { rank: i + 1 }));
  }
  function categoryStats(sessions) {
    return db.categories.map(c => {
      const ss = sessions.filter(s => s.categoryId === c.id);
      const correct = ss.reduce((a, s) => a + s.correct, 0), total = ss.reduce((a, s) => a + s.total, 0);
      return {
        category: c, rounds: ss.length,
        accuracy: total ? Math.round(correct / total * 100) : 0,
        avgScore: ss.length ? Math.round(ss.reduce((a, s) => a + s.totalScore, 0) / ss.length) : 0
      };
    });
  }
  function missedItems(answers) {
    const map = {};
    answers.forEach(a => {
      const m = map[a.questionId] || (map[a.questionId] = { attempts: 0, wrong: 0 });
      m.attempts++; if (!a.correct) m.wrong++;
    });
    return Object.entries(map).map(([id, m]) => ({ question: q.question(id), attempts: m.attempts, wrong: m.wrong, rate: Math.round(m.wrong / m.attempts * 100) }))
      .filter(x => x.question && x.wrong > 0)
      .sort((a, b) => b.wrong - a.wrong || b.rate - a.rate);
  }
  function missedTopics(answers) {
    const map = {};
    answers.forEach(a => {
      const qq = q.question(a.questionId); if (!qq) return;
      const key = qq.categoryId + '|' + (qq.topic || 'General');
      const m = map[key] || (map[key] = { category: q.category(qq.categoryId), topic: qq.topic || 'General', attempts: 0, wrong: 0 });
      m.attempts++; if (!a.correct) m.wrong++;
    });
    return Object.values(map).filter(m => m.wrong > 0 && m.category)
      .map(m => Object.assign(m, { rate: Math.round(m.wrong / m.attempts * 100) }))
      .sort((a, b) => b.wrong - a.wrong || b.rate - a.rate);
  }

  /* ---------- save a finished round ---------- */
  function saveSession(user, catId, level, answers, startedAt) {
    const id = uid('ses');
    const correct = answers.filter(a => a.correct).length;
    const s = {
      id, userId: user.id, categoryId: catId, difficulty: level,
      startedAt: new Date(startedAt).toISOString(), endedAt: new Date().toISOString(),
      totalScore: answers.reduce((a, x) => a + x.points, 0), correct, total: answers.length,
      accuracy: answers.length ? Math.round(correct / answers.length * 100) : 0,
      timeSpent: answers.reduce((a, x) => a + x.timeTaken, 0),
      hintsUsed: answers.filter(a => a.hintUsed).length, status: 'completed'
    };
    db.sessions.push(s);
    answers.forEach(a => db.answers.push(Object.assign({ id: uid('ans'), sessionId: id }, a)));
    const u = q.user(user.id);
    const newBadges = evaluateBadges(db, u, false);
    save();
    return { session: s, newBadges };
  }

  /* ---------- auth (simulates JWT login) ---------- */
  const auth = {
    login(email, password, role) {
      const u = db.users.find(x => x.email.toLowerCase() === String(email).trim().toLowerCase());
      if (!u || u.password !== password) return { error: 'Invalid email or password.' };
      if (u.role !== role) return { error: role === 'admin' ? 'This account does not have the administrator role.' : 'Administrator accounts sign in through the Admin Panel.' };
      if (u.status !== 'active') return { error: 'This account is deactivated. Please contact your instructor.' };
      store.set(AUTH_KEY + role, u.id);
      return { user: u };
    },
    register({ name, email, yearLevel, password }) {
      email = String(email).trim().toLowerCase();
      if (db.users.some(u => u.email.toLowerCase() === email)) return { error: 'That email is already registered.' };
      const u = { id: uid('usr'), role: 'student', name: name.trim(), email, password, yearLevel, status: 'active', badges: [], createdAt: new Date().toISOString() };
      db.users.push(u); save();
      store.set(AUTH_KEY + 'student', u.id);
      return { user: u };
    },
    current(role) {
      const id = store.get(AUTH_KEY + role);
      const u = id && q.user(id);
      return u && u.role === role && u.status === 'active' ? u : null;
    },
    logout(role) { store.del(AUTH_KEY + role); }
  };

  /* ---------- image resolver ---------- */
  function imageSrc(ref) {
    if (!ref) return '';
    if (ref.indexOf('svg:') === 0) {
      const s = (window.GU_IMAGES || {})[ref.slice(4)];
      return s ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s) : '';
    }
    return ref;
  }

  /* ---------- formatting ---------- */
  const fmt = {
    date: iso => new Date(iso).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }),
    dateTime: iso => new Date(iso).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
    ago(iso) {
      const s = (Date.now() - new Date(iso).getTime()) / 1000;
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      const d = Math.floor(s / 86400); return d === 1 ? 'yesterday' : d + 'd ago';
    },
    dur(sec) { sec = Math.round(sec); const m = Math.floor(sec / 60), s = sec % 60; return m ? `${m}m ${String(s).padStart(2, '0')}s` : `${s}s`; },
    num: n => Number(n || 0).toLocaleString('en-PH'),
    initials: name => String(name || '?').replace(/^(Prof\.|Dr\.|Mr\.|Ms\.)\s*/, '').split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase()
  };

  /* ---------- UI helpers: toast, modal, confirm, csv ---------- */
  const ui = {
    host() { return document.querySelector('.phone') || document.body; },
    toast(msg, type = 'ok') {
      let wrap = document.querySelector('.toast-wrap');
      const host = ui.host();
      if (!wrap || wrap.parentElement !== host) { if (wrap) wrap.remove(); wrap = document.createElement('div'); wrap.className = 'toast-wrap'; host.appendChild(wrap); }
      const t = document.createElement('div');
      t.className = 'toast toast-' + type; t.textContent = msg; t.setAttribute('role', 'status');
      wrap.appendChild(t);
      setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2600);
    },
    modal({ title, body, footer, size, onClose, sheet }) {
      const ov = document.createElement('div');
      ov.className = 'overlay' + (sheet ? ' overlay-sheet' : '');
      ov.innerHTML = `<div class="modal ${size ? 'modal-' + size : ''} ${sheet ? 'sheet' : ''}" role="dialog" aria-modal="true">
        ${title ? `<div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div>` : ''}
        <div class="modal-body"></div>${footer ? '<div class="modal-foot"></div>' : ''}</div>`;
      const b = ov.querySelector('.modal-body');
      typeof body === 'string' ? (b.innerHTML = body) : body && b.appendChild(body);
      if (footer) { const f = ov.querySelector('.modal-foot'); typeof footer === 'string' ? (f.innerHTML = footer) : f.appendChild(footer); }
      const close = () => { ov.classList.add('closing'); setTimeout(() => ov.remove(), 180); document.removeEventListener('keydown', onKey); onClose && onClose(); };
      const onKey = e => { if (e.key === 'Escape') close(); };
      ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) close(); });
      document.addEventListener('keydown', onKey);
      ui.host().appendChild(ov);
      return { el: ov, close };
    },
    confirm({ title = 'Are you sure?', message = '', okText = 'Confirm', cancelText = 'Cancel', danger = false }) {
      return new Promise(resolve => {
        let done = false;
        const m = ui.modal({
          title, size: 'sm',
          body: `<p class="muted">${message}</p>`,
          footer: `<button class="btn btn-ghost" data-close>${cancelText}</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${okText}</button>`,
          onClose: () => { if (!done) resolve(false); }
        });
        m.el.querySelector('[data-ok]').addEventListener('click', () => { done = true; resolve(true); m.close(); });
      });
    },
    csv(filename, rows) {
      const text = rows.map(r => r.map(v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' }));
      a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
  };

  window.GU = {
    cfg: CFG, seed: SEED,
    get db() { return db; },
    save, reset, q, auth, fmt, ui, imageSrc, esc: escHtml, shuffle, uid, norm,
    game: { pickRound: (c, l) => pickRound(db, c, l), check: checkAnswer, score: scoreAnswer, saveSession },
    stats: { leaderboard, categoryStats, missedItems, missedTopics, forUser: u => statsFor(db, u) }
  };
})();

</script>
<script>
/* =====================================================================
   GuessUp Prototype — ROUTER + PROTOTYPE HUB
   Screens are addressed by the URL hash, e.g. #/s/home or #/a/questions
   ===================================================================== */
(function () {
  const routes = {};
  let cleanups = [];
  GU.route = (path, fn) => { routes[path] = fn; };
  GU.onLeave = fn => cleanups.push(fn);
  GU.go = hash => { if (location.hash === hash) render(); else location.hash = hash; };
  GU.root = () => document.getElementById('root');

  function render() {
    cleanups.forEach(f => { try { f(); } catch (e) { /* ignore */ } });
    cleanups = [];
    document.querySelectorAll('.overlay, .toast-wrap').forEach(o => o.remove());
    const h = location.hash.slice(1) || '/';
    const [path, qs] = h.split('?');
    const fn = routes[path] || routes['/'];
    window.scrollTo(0, 0);
    fn(new URLSearchParams(qs || ''));
  }
  GU.render = render;
  window.addEventListener('hashchange', render);

  /* ---------------- HUB ---------------- */
  GU.route('/', () => {
    const c = GU.cfg;
    const student = GU.auth.current('student'), admin = GU.auth.current('admin');
    document.title = c.appName + ' — Prototype';
    GU.root().innerHTML = `
    <div class="hub"><div class="hub-inner">
      <div class="hub-logo"><div class="logo-mark">?</div><div><h1>${c.appName} Prototype</h1><div style="opacity:.8;font-weight:700">${c.tagline}</div></div></div>
      <p class="hub-sub">Android-Based Gamified Guessing Game Application for Information Technology Students of ${c.school}. An interactive prototype of the student mobile app and the administrator web panel described in Chapters I–III.</p>
      <div class="hub-grid">
        <div class="hub-card">
          <div class="emoji">📱</div><h2>Student Mobile App</h2>
          <p class="muted">Register, choose one of 7 subject categories and 3 difficulty levels, and play timed multiple-choice, picture, and word-puzzle rounds with hints, points, badges, and leaderboards.</p>
          <div class="cred">Demo: <b>student@jhcsc.edu.ph</b> / <b>student123</b></div>
          <a class="btn btn-primary" href="${student ? '#/s/home' : '#/s/login'}">${student ? 'Continue as ' + GU.esc(student.name.split(' ')[0]) : 'Open Student App'} →</a>
        </div>
        <div class="hub-card">
          <div class="emoji">🖥️</div><h2>Administrator Web Panel</h2>
          <p class="muted">Manage the question bank and categories, activate or deactivate students, monitor game sessions, and generate reports on the most-missed items.</p>
          <div class="cred">Demo: <b>admin@jhcsc.edu.ph</b> / <b>admin123</b></div>
          <a class="btn btn-accent" href="${admin ? '#/a/dashboard' : '#/a/login'}">${admin ? 'Continue to Dashboard' : 'Open Admin Panel'} →</a>
        </div>
      </div>
      <div class="hub-foot">
        <div>💾 Everything you do is saved in this browser only. Changes made in the Admin Panel appear in the Student App right away.</div>
        <button class="btn btn-ghost btn-sm" id="resetBtn">↺ Reset demo data</button>
      </div>
    </div></div>`;
    document.getElementById('resetBtn').onclick = async () => {
      const ok = await GU.ui.confirm({ title: 'Reset demo data?', message: 'This restores the original questions, users, and sample activity, and signs everyone out. Use this after editing the data sections of this file.', okText: 'Reset', danger: true });
      if (ok) { GU.reset(); GU.ui.toast('Demo data restored'); render(); }
    };
  });

  // All screen scripts register their routes first; then the first screen renders.
  document.addEventListener('DOMContentLoaded', render);
})();

</script>
<script>
/* =====================================================================
   GuessUp Prototype — STUDENT MOBILE APP SCREENS
   #/s/login  #/s/register  #/s/home  #/s/play  #/s/result
   #/s/leaderboard  #/s/progress  #/s/profile
   ===================================================================== */
(function () {
  const E = GU.esc, F = GU.fmt, C = GU.cfg;

  /* ---------- layout helpers ---------- */
  const NAV = [
    ['home', '🏠', 'Home'], ['leaderboard', '🏆', 'Ranks'], ['progress', '📈', 'Progress'], ['profile', '👤', 'Profile']
  ];
  function clock() { return new Date().toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, ''); }
  function phone(inner, nav) {
    document.title = C.appName + ' — Student App';
    GU.root().innerHTML = `
    <div class="phone-stage">
      <aside class="stage-side">
        <h3>📱 Student Mobile App</h3>
        <p>This frame shows the Android app. On a phone, the prototype fills the whole screen.</p>
        <p style="margin-top:12px"><a href="#/">← Prototype hub</a><br><a href="#/a/login">Open Admin Panel →</a></p>
      </aside>
      <div class="phone ${nav ? 'has-nav' : ''}">
        <div class="statusbar"><span>${clock()}</span><span>▂▄▆ 🔋</span></div>
        <div class="screen" id="screen">${inner}</div>
        ${nav ? `<nav class="bottom-nav">${NAV.map(n => `<a href="#/s/${n[0]}" class="${n[0] === nav ? 'active' : ''}"><span class="ic">${n[1]}</span>${n[2]}</a>`).join('')}</nav>` : ''}
      </div>
    </div>`;
    return document.getElementById('screen');
  }
  function guard() {
    const u = GU.auth.current('student');
    if (!u) { GU.go('#/s/login'); return null; }
    return u;
  }
  const catIcon = (c, size = 44) => `<span class="cat-ic" style="background:${c.color}1f;width:${size}px;height:${size}px">${c.icon}</span>`;
  const levelPill = l => `<span class="pill" style="background:${C.levels[l].color}22;color:${C.levels[l].color}">${C.levels[l].label}</span>`;
  const typePill = t => `<span class="pill pill-brand">${C.types[t].icon} ${C.types[t].label}</span>`;
  const levelIcon = { easy: '🌱', average: '⚡', difficult: '🔥' };

  /* ---------- LOGIN ---------- */
  GU.route('/s/login', () => {
    if (GU.auth.current('student')) return GU.go('#/s/home');
    const s = phone(`
      <div class="auth">
        <div class="auth-hero"><div class="logo-mark">?</div><h1>${C.appName}</h1><p class="muted" style="font-weight:700">${C.tagline}</p></div>
        <form class="auth-card" id="f" novalidate>
          <div class="field"><label for="em">Email address</label><input class="input" id="em" type="email" autocomplete="username" placeholder="you@jhcsc.edu.ph"></div>
          <div class="field"><label for="pw">Password</label><div class="pw-wrap"><input class="input" id="pw" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" class="icon-btn" id="eye">Show</button></div></div>
          <div class="error-text" id="err"></div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
          <button type="button" class="demo-chip" id="demo">🧪 <b>Demo account:</b> student@jhcsc.edu.ph / student123 <span class="muted">(tap to fill)</span></button>
        </form>
        <p class="auth-alt">New here? <a href="#/s/register">Create an account</a></p>
      </div>`);
    s.querySelector('#demo').onclick = () => { s.querySelector('#em').value = 'student@jhcsc.edu.ph'; s.querySelector('#pw').value = 'student123'; };
    s.querySelector('#eye').onclick = e => { const p = s.querySelector('#pw'); p.type = p.type === 'password' ? 'text' : 'password'; e.target.textContent = p.type === 'password' ? 'Show' : 'Hide'; };
    s.querySelector('#f').onsubmit = e => {
      e.preventDefault();
      const email = s.querySelector('#em').value, pw = s.querySelector('#pw').value;
      if (!email || !pw) { s.querySelector('#err').textContent = 'Enter your email and password.'; return; }
      const r = GU.auth.login(email, pw, 'student');
      if (r.error) { s.querySelector('#err').textContent = r.error; return; }
      GU.go('#/s/home');
    };
  });

  /* ---------- REGISTER ---------- */
  GU.route('/s/register', () => {
    const s = phone(`
      <div class="auth">
        <div class="topbar-s"><a class="icon-btn" href="#/s/login" aria-label="Back">←</a><h2>Create account</h2></div>
        <form class="auth-card" id="f" novalidate>
          <div class="field"><label for="nm">Full name</label><input class="input" id="nm" placeholder="Juan Dela Cruz" autocomplete="name"></div>
          <div class="field"><label for="em">Email address</label><input class="input" id="em" type="email" placeholder="you@jhcsc.edu.ph" autocomplete="email"></div>
          <div class="field"><label for="yr">Year level</label><select class="input" id="yr"><option value="">Select year level</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>
          <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" placeholder="At least 8 characters" autocomplete="new-password"></div>
          <div class="field"><label for="pw2">Confirm password</label><input class="input" id="pw2" type="password" autocomplete="new-password"></div>
          <div class="error-text" id="err"></div>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>
        <p class="auth-alt">Already have an account? <a href="#/s/login">Log in</a></p>
      </div>`);
    s.querySelector('#f').onsubmit = e => {
      e.preventDefault();
      const v = id => s.querySelector('#' + id).value.trim();
      const err = msg => { s.querySelector('#err').textContent = msg; };
      if (!v('nm') || !v('em') || !v('yr') || !v('pw')) return err('Please fill in all fields.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('em'))) return err('Enter a valid email address.');
      if (v('pw').length < 8) return err('Password must be at least 8 characters.');
      if (v('pw') !== v('pw2')) return err('Passwords do not match.');
      const r = GU.auth.register({ name: v('nm'), email: v('em'), yearLevel: v('yr'), password: v('pw') });
      if (r.error) return err(r.error);
      GU.ui.toast('Welcome to ' + C.appName + '!');
      GU.go('#/s/home');
    };
  });

  /* ---------- HOME ---------- */
  function openLevelSheet(cat) {
    let chosen = 'easy';
    const body = document.createElement('div');
    body.innerHTML = `
      <p class="muted" style="margin:-4px 0 14px;font-weight:700">${E(cat.description || '')}</p>
      ${Object.entries(C.levels).map(([k, L]) => `
        <button class="level-opt ${k === chosen ? 'selected' : ''}" data-l="${k}">
          <span class="level-dot" style="background:${L.color}22">${levelIcon[k] || '⭐'}</span>
          <span style="flex:1"><b>${L.label}</b><small>${E(L.desc)}</small>
            <span class="level-rules"><span class="pill pill-gray">⏱ ${L.seconds}s / item</span><span class="pill pill-gray">${L.hints ? `💡 ${L.hints} hint (−${L.hintPenalty} pts)` : '🚫 No hints'}</span><span class="pill pill-gray">⭐ ${L.points} pts</span></span>
          </span>
        </button>`).join('')}
      <button class="btn btn-primary btn-block" id="go" style="margin-top:6px">▶ Start round (${C.roundSize} items)</button>`;
    const m = GU.ui.modal({ title: `${cat.icon} ${E(cat.name)}`, body, sheet: true });
    body.querySelectorAll('.level-opt').forEach(b => b.onclick = () => {
      chosen = b.dataset.l;
      body.querySelectorAll('.level-opt').forEach(x => x.classList.toggle('selected', x === b));
    });
    body.querySelector('#go').onclick = () => { m.close(); GU.go(`#/s/play?cat=${cat.id}&level=${chosen}`); };
  }

  GU.route('/s/home', params => {
    const u = guard(); if (!u) return;
    const sessions = GU.q.sessionsOf(u.id);
    const points = sessions.reduce((a, s) => a + s.totalScore, 0);
    const stats = GU.stats.categoryStats(sessions);
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const s = phone(`
      <div class="hello">
        <div><p class="muted" style="font-weight:700">${greet} 👋</p><h2>${E(u.name.split(' ')[0])}</h2></div>
        <a class="avatar" href="#/s/profile" style="text-decoration:none">${F.initials(u.name)}</a>
      </div>
      <div class="hero-card">
        <h3 style="font-size:20px">Ready to guess?</h3>
        <p style="opacity:.9;font-size:14px;margin-top:4px">Pick a subject, choose a level, and beat the timer.</p>
        <div class="hero-stats">
          <div><b>${F.num(points)}</b><span>Total points</span></div>
          <div><b>${sessions.length}</b><span>Rounds</span></div>
          <div><b>${u.badges.length}/${GU.seed.badges.length}</b><span>Badges</span></div>
        </div>
      </div>
      <div class="section-title"><h3>Subject categories</h3><span class="muted small">${GU.db.categories.length} subjects</span></div>
      <div class="cat-grid">
        ${stats.map(st => {
          const c = st.category, n = GU.q.questionsIn(c.id).filter(x => x.active !== false).length;
          return `<button class="cat-card" data-c="${c.id}">
            ${catIcon(c)}<h4>${E(c.name)}</h4>
            <div class="meta">${st.rounds ? `${st.rounds} round${st.rounds > 1 ? 's' : ''} · ${st.accuracy}% accuracy` : `${n} items · not played yet`}</div>
            <div class="meter"><i style="width:${st.accuracy}%;background:${c.color}"></i></div>
          </button>`;
        }).join('')}
      </div>
      ${sessions.length ? `<div class="section-title"><h3>Recent rounds</h3><a href="#/s/progress">See all</a></div>
      <div class="card" style="padding:4px 14px">${sessions.slice(0, 3).map(histRow).join('')}</div>` : ''}
    `, 'home');
    s.querySelectorAll('.cat-card').forEach(b => b.onclick = () => {
      const c = GU.q.category(b.dataset.c);
      if (!GU.q.questionsIn(c.id).some(x => x.active !== false)) return GU.ui.toast('No questions in this category yet.', 'error');
      openLevelSheet(c);
    });
    bindHist(s);
    const pre = params.get('cat') && GU.q.category(params.get('cat'));
    if (pre) openLevelSheet(pre);
  });

  function histRow(se) {
    const c = GU.q.category(se.categoryId) || { icon: '❔', name: 'Deleted category', color: '#94A3B8' };
    return `<div class="hist-row" data-s="${se.id}">
      <span class="ic" style="background:${c.color}1f">${c.icon}</span>
      <div class="body"><b>${E(c.name)}</b><span class="muted">${C.levels[se.difficulty].label} · ${F.ago(se.endedAt)}</span></div>
      <div class="sc"><div style="color:var(--brand-dark)">${se.totalScore} pts</div><div class="small ${se.accuracy >= 60 ? '' : 'muted'}" style="color:${se.accuracy >= 60 ? 'var(--ok)' : ''}">${se.accuracy}%</div></div>
    </div>`;
  }
  const bindHist = s => s.querySelectorAll('.hist-row').forEach(r => r.onclick = () => GU.go('#/s/result?id=' + r.dataset.s));

  /* ---------- PLAY ---------- */
  GU.route('/s/play', params => {
    const u = guard(); if (!u) return;
    const cat = GU.q.category(params.get('cat'));
    const level = params.get('level');
    if (!cat || !C.levels[level]) return GU.go('#/s/home');
    const L = C.levels[level];
    const items = GU.game.pickRound(cat.id, level);
    const s = phone('<div id="play"></div>');
    const root = s.querySelector('#play');
    if (!items.length) {
      root.innerHTML = `<div class="empty"><span class="e-ic">📭</span>No questions available in this category yet.<br><br><a class="btn btn-primary" href="#/s/home">Back to Home</a></div>`;
      return;
    }
    const startedAt = Date.now();
    const results = [];
    let idx = 0, score = 0, timer = null, st = null;
    GU.onLeave(() => clearInterval(timer));

    function makePuzzle(answer) {
      const words = String(answer).toUpperCase().split(/\s+/).map(w => w.replace(/[^A-Z0-9]/g, '')).filter(Boolean);
      const letters = words.join('').split('');
      let tiles = GU.shuffle(letters.map((ch, i) => ({ ch, i })));
      for (let k = 0; k < 6 && letters.length > 1 && tiles.map(t => t.ch).join('') === letters.join(''); k++) tiles = GU.shuffle(tiles);
      return { words, tiles, slots: new Array(letters.length).fill(null) };
    }

    function start() {
      const q = items[idx];
      st = { q, hintUsed: false, locked: false, remaining: L.seconds, deadline: Date.now() + L.seconds * 1000 };
      if (q.type === 'puzzle') st.puzzle = makePuzzle(q.answer);
      if (q.type === 'mc') st.options = GU.shuffle([q.answer].concat(q.choices || []));
      draw();
      tick();
      clearInterval(timer);
      timer = setInterval(tick, 100);
    }

    function tick() {
      if (!st || st.locked) return;
      st.remaining = Math.max(0, (st.deadline - Date.now()) / 1000);
      const t = root.querySelector('.timer');
      if (t) {
        t.querySelector('i').style.width = (st.remaining / L.seconds * 100) + '%';
        t.querySelector('.timer-num').textContent = Math.ceil(st.remaining);
        t.classList.toggle('warn', st.remaining <= L.seconds * 0.5 && st.remaining > 10);
        t.classList.toggle('danger', st.remaining <= 10);
      }
      if (st.remaining <= 0) submit(null, true);
    }

    function hintText(q) {
      if (q.hint) return q.hint;
      const letters = String(q.answer).replace(/[^A-Za-z0-9]/g, '');
      return `Starts with "${letters[0] || '?'}" and has ${letters.length} characters.`;
    }

    function draw() {
      const q = st.q;
      root.innerHTML = `
        <div class="play-top">
          <button class="icon-btn" id="quit" aria-label="Quit round">✕</button>
          <div class="progress">${items.map((_, i) => `<i class="${i < idx ? (results[i].correct ? 'done-ok' : 'done-bad') : i === idx ? 'now' : ''}"></i>`).join('')}</div>
          <span class="score-chip">⭐ ${score}</span>
        </div>
        <div class="timer"><div class="timer-bar"><i style="width:100%"></i></div><span class="timer-num">${L.seconds}</span></div>
        <div class="q-card">
          <div class="q-meta">${typePill(q.type)}${levelPill(level)}<span class="pill pill-gray">${idx + 1} / ${items.length}</span></div>
          <div class="q-text">${E(q.question)}</div>
          ${q.code ? `<pre class="q-code">${E(q.code)}</pre>` : ''}
          ${q.image && q.type === 'picture' ? `<div class="q-img"><img src="${E(GU.imageSrc(q.image))}" alt="Question picture"></div>` : ''}
          <div id="hintArea"></div>
        </div>
        <div id="answerArea"></div>
        <div class="play-actions">
          <button class="btn btn-ghost" id="hintBtn" ${L.hints ? '' : 'disabled'}>${L.hints ? `💡 Hint <span class="small muted">−${L.hintPenalty}</span>` : '🚫 No hints'}</button>
          ${q.type !== 'mc' ? '<button class="btn btn-primary" id="submitBtn">Submit</button>' : ''}
        </div>`;
      root.querySelector('#quit').onclick = quit;
      root.querySelector('#hintBtn').onclick = useHint;
      const area = root.querySelector('#answerArea');

      if (q.type === 'mc') {
        area.innerHTML = `<div class="choices">${st.options.map((o, i) => `<button class="choice" data-i="${i}"><span class="key">${'ABCD'[i]}</span><span>${E(o)}</span></button>`).join('')}</div>`;
        area.querySelectorAll('.choice').forEach(b => b.onclick = () => submit(st.options[+b.dataset.i]));
      } else if (q.type === 'picture') {
        area.innerHTML = `<div class="answer-row"><input class="input" id="ans" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
        const inp = area.querySelector('#ans');
        inp.onkeydown = e => { if (e.key === 'Enter') trySubmitTyped(); };
        root.querySelector('#submitBtn').onclick = trySubmitTyped;
        setTimeout(() => inp.focus(), 50);
      } else {
        drawPuzzle();
        root.querySelector('#submitBtn').onclick = () => {
          if (st.puzzle.slots.some(x => x === null)) return GU.ui.toast('Fill in all the boxes first.', 'error');
          submit(puzzleValue());
        };
      }
    }

    function trySubmitTyped() {
      const v = root.querySelector('#ans').value.trim();
      if (!v) return GU.ui.toast('Type your answer first.', 'error');
      submit(v);
    }

    function puzzleValue() {
      const p = st.puzzle; let k = 0;
      return p.words.map(w => w.split('').map(() => p.tiles[p.slots[k++]].ch).join('')).join(' ');
    }

    function drawPuzzle() {
      const p = st.puzzle, area = root.querySelector('#answerArea');
      let k = 0;
      area.innerHTML = `
        <div class="slots">${p.words.map(w => `<div class="slot-word">${w.split('').map(() => { const i = k++; const t = p.slots[i]; return `<button class="slot ${t !== null ? 'filled' : ''}" data-s="${i}" aria-label="Letter box ${i + 1}">${t !== null ? p.tiles[t].ch : ''}</button>`; }).join('')}</div>`).join('')}</div>
        <div class="tiles">${p.tiles.map((t, i) => `<button class="tile ${p.slots.includes(i) ? 'used' : ''}" data-t="${i}">${t.ch}</button>`).join('')}</div>
        <div style="text-align:center;margin-top:10px"><button class="btn btn-sm btn-ghost" id="clr">Clear</button></div>`;
      area.querySelectorAll('.tile').forEach(b => b.onclick = () => {
        if (st.locked) return;
        const empty = p.slots.indexOf(null);
        if (empty === -1) return;
        p.slots[empty] = +b.dataset.t; drawPuzzle();
      });
      area.querySelectorAll('.slot').forEach(b => b.onclick = () => {
        if (st.locked) return;
        p.slots[+b.dataset.s] = null; drawPuzzle();
      });
      area.querySelector('#clr').onclick = () => { if (!st.locked) { p.slots.fill(null); drawPuzzle(); } };
    }

    function useHint() {
      if (st.locked || st.hintUsed || !L.hints) return;
      st.hintUsed = true;
      root.querySelector('#hintArea').innerHTML = `<div class="hint-box">💡 ${E(hintText(st.q))}</div>`;
      const b = root.querySelector('#hintBtn'); b.disabled = true; b.innerHTML = '💡 Hint used';
    }

    function submit(value, timedOut) {
      if (!st || st.locked) return;
      st.locked = true; clearInterval(timer);
      const q = st.q;
      const correct = !timedOut && GU.game.check(q, value);
      const timeTaken = Math.max(1, Math.round(L.seconds - st.remaining));
      const pts = GU.game.score(level, correct, st.remaining, st.hintUsed);
      score += pts;
      results.push({ questionId: q.id, submitted: timedOut ? '' : String(value), correct, hintUsed: st.hintUsed, timeTaken: timedOut ? L.seconds : timeTaken, points: pts });
      if (q.type === 'mc') {
        root.querySelectorAll('.choice').forEach(b => {
          const o = st.options[+b.dataset.i]; b.disabled = true;
          if (o === q.answer) b.classList.add('correct'); else if (o === value) b.classList.add('wrong');
        });
      }
      root.querySelector('.score-chip').textContent = '⭐ ' + score;
      setTimeout(() => showFeedback(q, correct, timedOut, pts), q.type === 'mc' ? 550 : 150);
    }

    function showFeedback(q, correct, timedOut, pts) {
      const last = idx === items.length - 1;
      const title = correct ? ['Correct!', 'Nice one!', 'You got it!', 'Brilliant!'][Math.floor(Math.random() * 4)] : timedOut ? "Time's up!" : 'Not quite!';
      const body = `
        <div class="feedback ${correct ? 'fb-ok' : 'fb-bad'}">
          <div class="fb-icon">${correct ? '✅' : timedOut ? '⏰' : '❌'}</div>
          <h2 class="fb-title">${title}</h2>
          ${correct ? `<span class="fb-points">+${pts} points${st.hintUsed ? ' <span class="small muted">(hint −' + L.hintPenalty + ')</span>' : ''}</span>` : ''}
          <div class="fb-answer"><span class="muted small" style="font-weight:800">CORRECT ANSWER</span><br><b>${E(q.answer)}</b></div>
          ${q.explanation ? `<p class="fb-expl">📘 ${E(q.explanation)}</p>` : ''}
        </div>`;
      GU.ui.modal({
        body, sheet: true,
        footer: `<button class="btn ${correct ? 'btn-ok' : 'btn-primary'} btn-block" data-close>${last ? 'See results 🏁' : 'Next question →'}</button>`,
        onClose: next
      });
    }

    function next() {
      idx++;
      if (idx < items.length) start(); else finish();
    }

    function finish() {
      const r = GU.game.saveSession(u, cat.id, level, results, startedAt);
      GU.go(`#/s/result?id=${r.session.id}&nb=${r.newBadges.map(b => b.id).join(',')}&fresh=1`);
    }

    async function quit() {
      if (st.locked) return;
      clearInterval(timer);
      const left = st.remaining;
      const ok = await GU.ui.confirm({ title: 'Quit this round?', message: 'Your answers in this round will not be saved.', okText: 'Quit round', cancelText: 'Keep playing', danger: true });
      if (ok) return GU.go('#/s/home');
      st.deadline = Date.now() + left * 1000;
      timer = setInterval(tick, 100);
    }

    start();
  });

  /* ---------- RESULT ---------- */
  GU.route('/s/result', params => {
    const u = guard(); if (!u) return;
    const se = GU.q.session(params.get('id'));
    if (!se || se.userId !== u.id) return GU.go('#/s/home');
    const c = GU.q.category(se.categoryId) || { icon: '❔', name: 'Deleted category', color: '#94A3B8', id: '' };
    const answers = GU.q.answersOf(se.id);
    const nb = (params.get('nb') || '').split(',').filter(Boolean).map(id => GU.seed.badges.find(b => b.id === id)).filter(Boolean);
    const fresh = params.get('fresh') === '1';
    const board = GU.stats.leaderboard(se.categoryId);
    const myRank = (board.find(b => b.user.id === u.id) || {}).rank;
    const trophy = se.accuracy >= 80 ? '🏆' : se.accuracy >= 50 ? '🎉' : '💪';
    const msg = se.accuracy === 100 ? 'Perfect round!' : se.accuracy >= 80 ? 'Excellent work!' : se.accuracy >= 50 ? 'Good job, keep going!' : 'Keep practicing, you got this!';
    const s = phone(`
      <div class="topbar-s"><a class="icon-btn" href="#/s/home" aria-label="Home">✕</a><h2 style="font-size:18px">${fresh ? 'Round complete' : 'Round details'}</h2></div>
      <div class="result-hero">
        <div class="trophy">${trophy}</div>
        <h2 style="font-size:24px;margin-top:4px">${msg}</h2>
        <p class="muted small" style="font-weight:700;margin:4px 0 10px">${c.icon} ${E(c.name)} · ${levelPill(se.difficulty)}</p>
        <div class="big-score">${se.totalScore}</div><div class="muted" style="font-weight:800">points</div>
      </div>
      <div class="stat-row">
        <div class="stat"><b style="color:${se.accuracy >= 60 ? 'var(--ok)' : 'var(--bad)'}">${se.accuracy}%</b><span>Accuracy</span></div>
        <div class="stat"><b>${se.correct}/${se.total}</b><span>Correct</span></div>
        <div class="stat"><b>${F.dur(se.timeSpent)}</b><span>Time used</span></div>
      </div>
      ${myRank ? `<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span style="font-size:28px">📊</span><div style="flex:1"><b>Rank #${myRank}</b> of ${board.length}<div class="muted small">in ${E(c.name)}</div></div><a class="btn btn-sm btn-ghost" href="#/s/leaderboard?cat=${c.id}">View</a></div>` : ''}
      ${nb.length ? `<div class="section-title" style="margin-top:6px"><h3>🎖️ New badge${nb.length > 1 ? 's' : ''} unlocked!</h3></div>${nb.map(b => `<div class="new-badge"><span class="bi">${b.icon}</span><div><b>${E(b.name)}</b><div class="small">${E(b.desc)}</div></div></div>`).join('')}` : ''}
      <div class="section-title"><h3>Review answers</h3></div>
      ${answers.map((a, i) => {
        const q = GU.q.question(a.questionId);
        if (!q) return '';
        return `<div class="review-item"><span class="ri-ic">${a.correct ? '✅' : '❌'}</span><div style="flex:1;min-width:0">
          <b>${i + 1}. ${E(q.question)}</b>
          <div class="muted" style="margin-top:3px">Your answer: <b style="color:${a.correct ? 'var(--ok)' : 'var(--bad)'}">${a.submitted ? E(a.submitted) : '<i>no answer (time ran out)</i>'}</b></div>
          ${a.correct ? '' : `<div>Correct: <b>${E(q.answer)}</b></div>`}
          <div class="small muted">${a.timeTaken}s${a.hintUsed ? ' · 💡 hint used' : ''} · +${a.points} pts</div></div></div>`;
      }).join('')}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
        <a class="btn btn-ghost" href="#/s/home">🏠 Home</a>
        <a class="btn btn-primary" href="#/s/play?cat=${c.id}&level=${se.difficulty}">↻ Play again</a>
      </div>`);
    if (fresh && se.accuracy >= 80) confetti(s.closest('.phone'));
  });

  function confetti(host) {
    const box = document.createElement('div'); box.className = 'confetti';
    const colors = ['#6C4CF1', '#FFC83D', '#22C55E', '#EC4899', '#0EA5E9'];
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      p.style.animationDelay = Math.random() * .6 + 's';
      box.appendChild(p);
    }
    host.appendChild(box);
    setTimeout(() => box.remove(), 4200);
  }

  /* ---------- LEADERBOARD ---------- */
  GU.route('/s/leaderboard', params => {
    const u = guard(); if (!u) return;
    const mine = GU.q.sessionsOf(u.id);
    let catId = params.get('cat') || (mine[0] && mine[0].categoryId) || GU.db.categories[0].id;
    if (!GU.q.category(catId)) catId = GU.db.categories[0].id;
    const s = phone(`
      <div class="topbar-s"><h2>Leaderboard</h2></div>
      <p class="muted small" style="font-weight:700;margin:-6px 0 10px">Rankings are per subject, so everyone can shine somewhere.</p>
      <div class="chip-row">${GU.db.categories.map(c => `<button class="chip ${c.id === catId ? 'active' : ''}" data-c="${c.id}">${c.icon} ${E(c.name)}</button>`).join('')}</div>
      <div id="lb"></div>`, 'leaderboard');
    function draw() {
      const board = GU.stats.leaderboard(catId);
      const box = s.querySelector('#lb');
      if (!board.length) { box.innerHTML = `<div class="empty"><span class="e-ic">🏁</span>No one has played this subject yet. Be the first!<br><br><a class="btn btn-primary" href="#/s/home?cat=${catId}">Play now</a></div>`; return; }
      const top = board.slice(0, 3);
      const order = [top[1], top[0], top[2]];
      const me = board.find(b => b.user.id === u.id);
      box.innerHTML = `
        <div class="podium">${order.map((b, i) => b ? `<div class="pod pod-${b.rank}">
          <div class="avatar" style="${b.user.id === u.id ? 'outline:3px solid var(--accent)' : ''}">${F.initials(b.user.name)}</div>
          <div class="name">${E(b.user.name)}</div><div class="pts">${F.num(b.points)} pts</div>
          <div class="base">${b.rank}</div></div>` : '<div></div>').join('')}</div>
        ${me && me.rank > 3 ? `<div class="lb-row me" style="margin-bottom:14px"><span class="lb-rank">${me.rank}</span><span class="avatar">${F.initials(u.name)}</span><div class="lb-name"><b>You</b><span>${me.rounds} rounds · ${me.accuracy}% acc.</span></div><span class="lb-pts">${F.num(me.points)}</span></div>` : ''}
        ${board.slice(3).map(b => `<div class="lb-row ${b.user.id === u.id ? 'me' : ''}"><span class="lb-rank">${b.rank}</span><span class="avatar" style="background:${b.user.id === u.id ? 'var(--brand)' : '#A89BEA'}">${F.initials(b.user.name)}</span><div class="lb-name"><b>${b.user.id === u.id ? 'You' : E(b.user.name)}</b><span>${b.rounds} rounds · ${b.accuracy}% acc.</span></div><span class="lb-pts">${F.num(b.points)}</span></div>`).join('')}
        ${!me ? `<div class="card" style="text-align:center;margin-top:8px"><b>You're not ranked here yet.</b><p class="muted small" style="margin:4px 0 10px">Finish a round in this subject to join.</p><a class="btn btn-primary btn-sm" href="#/s/home?cat=${catId}">Play this subject</a></div>` : ''}`;
    }
    s.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
      catId = ch.dataset.c;
      s.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === ch));
      history.replaceState(null, '', '#/s/leaderboard?cat=' + catId);
      draw();
    });
    draw();
    const act = s.querySelector('.chip.active'); if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });
  });

  /* ---------- PROGRESS ---------- */
  GU.route('/s/progress', () => {
    const u = guard(); if (!u) return;
    const sessions = GU.q.sessionsOf(u.id);
    const answers = GU.q.answersOfUser(u.id);
    const total = answers.length, correct = answers.filter(a => a.correct).length;
    const cats = GU.stats.categoryStats(sessions).filter(x => x.rounds);
    const topics = GU.stats.missedTopics(answers).slice(0, 5);
    const s = phone(`
      <div class="topbar-s"><h2>My Progress</h2></div>
      ${!sessions.length ? `<div class="empty"><span class="e-ic">📈</span>Play your first round to see your progress here.<br><br><a class="btn btn-primary" href="#/s/home">Start playing</a></div>` : `
      <div class="stat-row" style="margin-top:0">
        <div class="stat"><b>${sessions.length}</b><span>Rounds</span></div>
        <div class="stat"><b>${Math.round(correct / Math.max(1, total) * 100)}%</b><span>Accuracy</span></div>
        <div class="stat"><b>${F.num(sessions.reduce((a, x) => a + x.totalScore, 0))}</b><span>Points</span></div>
      </div>
      <div class="section-title" style="margin-top:4px"><h3>Accuracy by subject</h3></div>
      <div class="card">${cats.map(x => `<div class="cat-line"><span class="ic" style="background:${x.category.color}1f">${x.category.icon}</span><div class="body"><b>${E(x.category.name)}</b><div class="meter" style="margin-top:5px"><i style="width:${x.accuracy}%;background:${x.category.color}"></i></div></div><span class="val">${x.accuracy}%</span></div>`).join('')}</div>
      <div class="section-title"><h3>Topics to review</h3></div>
      <div class="card">${topics.length ? topics.map(t => `<div class="cat-line"><span class="ic" style="background:${t.category.color}1f">${t.category.icon}</span><div class="body"><b>${E(t.topic)}</b><span class="muted small">${E(t.category.name)} · missed ${t.wrong} of ${t.attempts}</span></div><a class="btn btn-sm btn-ghost" href="#/s/home?cat=${t.category.id}">Practice</a></div>`).join('') : '<p class="muted small">No missed topics. Amazing! 🎯</p>'}</div>
      <div class="section-title"><h3>Score history</h3></div>
      <div class="card" style="padding:4px 14px">${sessions.slice(0, 20).map(histRow).join('')}</div>`}
    `, 'progress');
    bindHist(s);
  });

  /* ---------- PROFILE ---------- */
  GU.route('/s/profile', () => {
    const u = guard(); if (!u) return;
    const have = Object.fromEntries(u.badges.map(b => [b.id, b]));
    const s = phone(`
      <div class="profile-head">
        <div class="avatar avatar-lg">${F.initials(u.name)}</div>
        <h2 style="font-size:24px">${E(u.name)}</h2>
        <p class="muted small" style="font-weight:700">${E(u.email)}</p>
        <div style="margin-top:8px;display:flex;gap:6px;justify-content:center"><span class="pill pill-brand">${E(u.yearLevel || 'Student')}</span><span class="pill pill-gray">BSIT</span></div>
      </div>
      <div class="section-title"><h3>Badges</h3><span class="muted small">${u.badges.length} of ${GU.seed.badges.length}</span></div>
      <div class="badge-grid">${GU.seed.badges.map(b => `<button class="badge ${have[b.id] ? '' : 'locked'}" data-b="${b.id}"><span class="bi">${b.icon}</span><b>${E(b.name)}</b></button>`).join('')}</div>
      <div class="section-title"><h3>Account</h3></div>
      <div class="menu-list">
        <button id="edit">✏️ Edit profile</button>
        <button id="pass">🔒 Change password</button>
        <button id="about">ℹ️ About ${C.appName}</button>
        <button id="out" class="danger">🚪 Log out</button>
      </div>`, 'profile');
    s.querySelectorAll('.badge').forEach(el => el.onclick = () => {
      const b = GU.seed.badges.find(x => x.id === el.dataset.b), h = have[b.id];
      GU.ui.modal({ size: 'sm', body: `<div style="text-align:center;padding:10px 0"><div style="font-size:56px;${h ? '' : 'filter:grayscale(1);opacity:.35'}">${b.icon}</div><h3 style="font-size:22px;margin-top:6px">${E(b.name)}</h3><p class="muted" style="margin-top:6px">${E(b.desc)}</p><p style="margin-top:12px">${h ? `<span class="pill pill-ok">Unlocked ${F.date(h.at)}</span>` : '<span class="pill pill-gray">🔒 Locked</span>'}</p></div>`, footer: '<button class="btn btn-primary btn-block" data-close>OK</button>' });
    });
    s.querySelector('#edit').onclick = () => {
      const m = GU.ui.modal({
        title: 'Edit profile', size: 'sm',
        body: `<div class="field"><label>Full name</label><input class="input" id="pn" value="${E(u.name)}"></div>
          <div class="field"><label>Year level</label><select class="input" id="py">${['1st Year', '2nd Year', '3rd Year', '4th Year'].map(y => `<option ${y === u.yearLevel ? 'selected' : ''}>${y}</option>`).join('')}</select></div>`,
        footer: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ps">Save</button>'
      });
      m.el.querySelector('#ps').onclick = () => {
        const n = m.el.querySelector('#pn').value.trim();
        if (!n) return GU.ui.toast('Name is required.', 'error');
        u.name = n; u.yearLevel = m.el.querySelector('#py').value; GU.save(); m.close(); GU.ui.toast('Profile updated'); GU.render();
      };
    };
    s.querySelector('#pass').onclick = () => {
      const m = GU.ui.modal({
        title: 'Change password', size: 'sm',
        body: `<div class="field"><label>Current password</label><input class="input" type="password" id="p0"></div>
          <div class="field"><label>New password</label><input class="input" type="password" id="p1" placeholder="At least 8 characters"></div>
          <div class="field"><label>Confirm new password</label><input class="input" type="password" id="p2"></div><div class="error-text" id="pe"></div>`,
        footer: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ps">Update</button>'
      });
      m.el.querySelector('#ps').onclick = () => {
        const g = id => m.el.querySelector(id).value, er = t => m.el.querySelector('#pe').textContent = t;
        if (g('#p0') !== u.password) return er('Current password is incorrect.');
        if (g('#p1').length < 8) return er('New password must be at least 8 characters.');
        if (g('#p1') !== g('#p2')) return er('Passwords do not match.');
        u.password = g('#p1'); GU.save(); m.close(); GU.ui.toast('Password changed');
      };
    };
    s.querySelector('#about').onclick = () => GU.ui.modal({
      title: 'About ' + C.appName, size: 'sm',
      body: `<p>${E(C.appName)} is a gamified guessing game for reviewing core IT subjects of the ${E(C.program)} program at ${E(C.school)}.</p><p class="muted small" style="margin-top:10px">Prototype build. Scores are for review only and are not part of official grades.</p>`,
      footer: '<button class="btn btn-primary" data-close>Close</button>'
    });
    s.querySelector('#out').onclick = async () => {
      if (await GU.ui.confirm({ title: 'Log out?', message: 'You can log back in anytime.', okText: 'Log out', danger: true })) {
        GU.auth.logout('student'); GU.go('#/s/login');
      }
    };
  });
})();

</script>
<script>
/* =====================================================================
   GuessUp Prototype — ADMINISTRATOR WEB PANEL SCREENS
   #/a/login  #/a/dashboard  #/a/questions  #/a/categories
   #/a/students  #/a/sessions  #/a/reports
   ===================================================================== */
(function () {
  const E = GU.esc, F = GU.fmt, C = GU.cfg;
  const NAV = [
    ['dashboard', '📊', 'Dashboard'], ['questions', '❓', 'Question Bank'], ['categories', '🗂️', 'Categories'],
    ['students', '👥', 'Students'], ['sessions', '🎮', 'Game Sessions'], ['reports', '📑', 'Reports']
  ];

  function guard() {
    const u = GU.auth.current('admin');
    if (!u) { GU.go('#/a/login'); return null; }
    return u;
  }
  function shell(active, title, html) {
    const u = GU.auth.current('admin');
    document.title = title + ' — ' + C.appName + ' Admin';
    GU.root().innerHTML = `
    <div class="admin">
      <aside class="sidebar" id="sidebar">
        <div class="side-logo"><div class="logo-mark">?</div><div><b>${C.appName}</b><small>Administrator Panel</small></div></div>
        <nav class="side-nav">${NAV.map(n => `<a href="#/a/${n[0]}" class="${n[0] === active ? 'active' : ''}"><span class="ic">${n[1]}</span>${n[2]}</a>`).join('')}</nav>
        <div class="side-foot">${E(C.school)}<br><a href="#/">← Prototype hub</a> · <a href="#/s/login">Student app</a></div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-toggle" id="menuT" aria-label="Menu">☰</button>
          <h1>${title}</h1>
          <div class="who"><span><b>${E(u.name)}</b><br><span class="muted">Administrator</span></span><span class="avatar">${F.initials(u.name)}</span>
          <button class="btn btn-ghost btn-sm" id="logout">Log out</button></div>
        </header>
        <div class="content" id="content">${html}</div>
      </div>
    </div>`;
    const sb = document.getElementById('sidebar');
    document.getElementById('menuT').onclick = e => { e.stopPropagation(); sb.classList.toggle('open'); };
    document.querySelector('.main').addEventListener('click', () => sb.classList.remove('open'));
    document.getElementById('logout').onclick = async () => {
      if (await GU.ui.confirm({ title: 'Log out?', message: 'You will return to the admin login page.', okText: 'Log out' })) { GU.auth.logout('admin'); GU.go('#/a/login'); }
    };
    return document.getElementById('content');
  }
  const catPill = c => c ? `<span class="pill" style="background:${c.color}1f;color:${c.color}">${c.icon} ${E(c.name)}</span>` : '<span class="pill pill-gray">—</span>';
  const levelPill = l => C.levels[l] ? `<span class="pill" style="background:${C.levels[l].color}22;color:${C.levels[l].color}">${C.levels[l].label}</span>` : '';
  const accPill = a => `<span class="pill ${a >= 75 ? 'pill-ok' : a >= 50 ? 'pill-warn' : 'pill-bad'}">${a}%</span>`;
  const catOptions = (sel, all = 'All categories') => `<option value="">${all}</option>` + GU.db.categories.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${E(c.name)}</option>`).join('');
  const periodFilter = days => s => !days || (Date.now() - new Date(s.startedAt).getTime()) <= days * 86400000;
  const bars = rows => `<div class="bars">${rows.map(r => `<div class="bar-row"><span class="lbl" title="${E(r.label)}">${r.label}</span><div class="bar-track"><i style="width:${Math.max(0, Math.min(100, r.pct))}%;background:${r.color || 'var(--brand)'}"></i></div><span class="v">${r.value}</span></div>`).join('')}</div>`;

  /* ---------- LOGIN ---------- */
  GU.route('/a/login', () => {
    if (GU.auth.current('admin')) return GU.go('#/a/dashboard');
    document.title = 'Admin Login — ' + C.appName;
    GU.root().innerHTML = `
    <div class="login-admin">
      <div class="login-art">
        <div class="hub-logo"><div class="logo-mark">?</div><div><b style="font-family:var(--font-display);font-size:24px">${C.appName}</b><div style="opacity:.75;font-size:13px;font-weight:700">Administrator Panel</div></div></div>
        <div><h2>Build the question bank.<br>See what students miss.<br>Reteach where it counts.</h2>
        <p style="opacity:.8;margin-top:14px;max-width:420px">Manage categories and question items, monitor game sessions, and generate performance reports for the BSIT program.</p></div>
        <p style="opacity:.6;font-size:13px">${E(C.school)}</p>
      </div>
      <div class="login-form"><div>
        <h1 style="font-size:28px">Welcome back</h1>
        <p class="muted" style="margin:4px 0 22px">Sign in with an administrator account.</p>
        <form id="f" novalidate>
          <div class="field"><label for="em">Email address</label><input class="input" id="em" type="email" autocomplete="username" placeholder="admin@jhcsc.edu.ph"></div>
          <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password"></div>
          <div class="error-text" id="err"></div>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <button type="button" class="demo-chip" id="demo">🧪 <b>Demo:</b> admin@jhcsc.edu.ph / admin123 <span class="muted">(click to fill)</span></button>
        <p class="auth-alt"><a href="#/">← Back to prototype hub</a></p>
      </div></div>
    </div>`;
    const r = GU.root();
    r.querySelector('#demo').onclick = () => { r.querySelector('#em').value = 'admin@jhcsc.edu.ph'; r.querySelector('#pw').value = 'admin123'; };
    r.querySelector('#f').onsubmit = e => {
      e.preventDefault();
      const res = GU.auth.login(r.querySelector('#em').value, r.querySelector('#pw').value, 'admin');
      if (res.error) { r.querySelector('#err').textContent = res.error; return; }
      GU.go('#/a/dashboard');
    };
  });

  /* ---------- DASHBOARD ---------- */
  GU.route('/a/dashboard', () => {
    if (!guard()) return;
    const db = GU.db;
    const students = GU.q.students();
    const last30 = db.sessions.filter(periodFilter(30));
    const answers30 = new Set(last30.map(s => s.id));
    const ans30 = db.answers.filter(a => answers30.has(a.sessionId));
    const acc = ans30.length ? Math.round(ans30.filter(a => a.correct).length / ans30.length * 100) : 0;
    const catStats = GU.stats.categoryStats(last30);
    const missed = GU.stats.missedItems(ans30).slice(0, 5);
    const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (13 - i)); return d; });
    const perDay = days.map(d => db.sessions.filter(s => { const t = new Date(s.startedAt); t.setHours(0, 0, 0, 0); return t.getTime() === d.getTime(); }).length);
    const maxDay = Math.max(1, ...perDay);
    const recent = db.sessions.slice().sort((a, b) => b.endedAt.localeCompare(a.endedAt)).slice(0, 7);
    const c = shell('dashboard', 'Dashboard', `
      <div class="page-head"><div><h2 style="font-size:22px">Overview</h2><p>Activity in the last 30 days</p></div><a class="btn btn-primary" href="#/a/questions?new=1">＋ Add question</a></div>
      <div class="tiles-4">
        <div class="kpi"><span class="k-ic" style="background:#EDE9FE">👥</span><div><b>${students.filter(s => s.status === 'active').length}</b><span>Active students (${students.length} total)</span></div></div>
        <div class="kpi"><span class="k-ic" style="background:#E0F2FE">❓</span><div><b>${db.questions.filter(q => q.active !== false).length}</b><span>Active questions</span></div></div>
        <div class="kpi"><span class="k-ic" style="background:#DCFCE7">🎮</span><div><b>${last30.length}</b><span>Rounds played</span></div></div>
        <div class="kpi"><span class="k-ic" style="background:#FEF3C7">🎯</span><div><b>${acc}%</b><span>Average accuracy</span></div></div>
      </div>
      <div class="grid-2" style="margin-bottom:18px">
        <div class="panel"><div class="panel-head"><h3>Average accuracy per category</h3><a class="small" href="#/a/reports">Full report →</a></div>
          <div class="panel-body">${bars(catStats.map(x => ({ label: x.category.icon + ' ' + E(x.category.name), pct: x.accuracy, value: x.rounds ? x.accuracy + '%' : '—', color: x.category.color })))}</div></div>
        <div class="panel"><div class="panel-head"><h3>Rounds per day</h3><span class="muted small">Last 14 days</span></div>
          <div class="panel-body"><div class="cols">${perDay.map((n, i) => `<div class="col"><em>${n || ''}</em><i style="height:${n / maxDay * 120}px"></i><span>${days[i].getDate()}</span></div>`).join('')}</div></div></div>
      </div>
      <div class="grid-2">
        <div class="panel"><div class="panel-head"><h3>Most missed items</h3><a class="small" href="#/a/reports">View all →</a></div>
          <div class="table-wrap"><table class="tbl"><thead><tr><th>Question</th><th>Category</th><th>Wrong</th></tr></thead><tbody>
          ${missed.map(m => `<tr><td class="q-cell"><b title="${E(m.question.question)}">${E(m.question.question)}</b><span class="muted small">${E(m.question.topic)}</span></td><td>${catPill(GU.q.category(m.question.categoryId))}</td><td><span class="pill pill-bad">${m.rate}%</span> <span class="muted small">${m.wrong}/${m.attempts}</span></td></tr>`).join('') || '<tr><td colspan="3" class="muted">No data yet.</td></tr>'}

      const all = list(), pages = Math.max(1, Math.ceil(all.length / PAGE));

      $('#rows').innerHTML = rows.map(q => `<tr>

      $('#count').textContent = `Showing ${rows.length ? (f.page - 1) * PAGE + 1 : 0}–${(f.page - 1) * PAGE + rows.length} of ${all.length} items · page ${f.page} of ${pages}`;
      $('#prev').disabled = f.page <= 1; $('#next').disabled = f.page >= pages;
      c.querySelectorAll('[data-act]').forEach(t => t.onchange = () => { const q = GU.q.question(t.dataset.act); q.active = t.checked; GU.save(); GU.ui.toast(t.checked ? 'Question activated' : 'Question deactivated'); });
      c.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => preview(GU.q.question(b.dataset.pv)));
      c.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => questionForm(GU.q.question(b.dataset.ed), draw));
      c.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        const q = GU.q.question(b.dataset.del);

        if (await GU.ui.confirm({ title: 'Delete this question?', message: `"${E(q.question)}"${used ? `<br><br>It has <b>${used}</b> recorded answers. Consider deactivating it instead, to keep reports accurate.` : ''}`, okText: 'Delete', danger: true })) {
          GU.db.questions.splice(GU.db.questions.indexOf(q), 1); GU.save(); GU.ui.toast('Question deleted'); draw();

    $('#fc').onchange = e => { f.cat = e.target.value; f.page = 1; draw(); };

    $('#fl').onchange = e => { f.level = e.target.value; f.page = 1; draw(); };
    $('#fa').onchange = e => { f.status = e.target.value; f.page = 1; draw(); };
    $('#prev').onclick = () => { f.page--; draw(); };
    $('#next').onclick = () => { f.page++; draw(); };
    $('#add').onclick = () => questionForm(null, draw);
    draw();
    if (params.get('new')) questionForm(null, draw);

  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const max = 720, k = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.82));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

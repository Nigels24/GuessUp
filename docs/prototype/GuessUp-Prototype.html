      c.querySelector('#rows').innerHTML = rows.map(r => `<tr>
        <td><div class="user-cell"><span class="avatar" style="${r.u.status !== 'active' ? 'background:#94A3B8' : ''}">${F.initials(r.u.name)}</span><div><b>${E(r.u.name)}</b><span>${E(r.u.email)}</span></div></div></td>
        <td>${E(r.u.yearLevel || '—')}</td><td>${r.rounds}</td><td><b>${F.num(r.points)}</b></td><td>${r.rounds ? accPill(r.accuracy) : '—'}</td>
        <td class="muted small">${r.last ? F.ago(r.last) : 'Never'}</td>
        <td>${r.u.status === 'active' ? '<span class="pill pill-ok">● Active</span>' : '<span class="pill pill-gray">● Inactive</span>'}</td>
        <td class="actions"><button class="btn btn-ghost btn-sm" data-v="${r.u.id}">View</button> <button class="btn btn-sm ${r.u.status === 'active' ? 'btn-ghost' : 'btn-ok'}" data-t="${r.u.id}">${r.u.status === 'active' ? 'Deactivate' : 'Activate'}</button></td>
      </tr>`).join('') || `<tr><td colspan="8"><div class="empty"><span class="e-ic">👥</span>No students match.</div></td></tr>`;
      c.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => {
        const u = GU.q.user(b.dataset.t), off = u.status === 'active';
        if (await GU.ui.confirm({ title: (off ? 'Deactivate ' : 'Activate ') + E(u.name) + '?', message: off ? 'The student will not be able to log in, and will be hidden from leaderboards.' : 'The student will be able to log in and play again.', okText: off ? 'Deactivate' : 'Activate', danger: off })) {
          u.status = off ? 'inactive' : 'active'; GU.save(); GU.ui.toast(`${u.name} ${off ? 'deactivated' : 'activated'}`); draw();
        }
      });
      c.querySelectorAll('[data-v]').forEach(b => b.onclick = () => studentDetail(GU.q.user(b.dataset.v)));
    }
    c.querySelector('#fs').oninput = e => { f.search = e.target.value; draw(); };
    c.querySelector('#fy').onchange = e => { f.year = e.target.value; draw(); };
    c.querySelector('#fa').onchange = e => { f.status = e.target.value; draw(); };
    draw();
  });

  function studentDetail(u) {
    const r = studentRow(u), ss = GU.q.sessionsOf(u.id);
    const cats = GU.stats.categoryStats(ss).filter(x => x.rounds);
    const topics = GU.stats.missedTopics(GU.q.answersOfUser(u.id)).slice(0, 5);
    GU.ui.modal({
      title: E(u.name), size: 'lg',
      body: `<p class="muted" style="margin-top:-6px">${E(u.email)} · ${E(u.yearLevel || '')} · joined ${F.date(u.createdAt)}</p>
        <div class="tiles-4" style="margin-top:14px">
          <div class="kpi"><div><b>${r.rounds}</b><span>Rounds</span></div></div><div class="kpi"><div><b>${F.num(r.points)}</b><span>Points</span></div></div>
          <div class="kpi"><div><b>${r.accuracy}%</b><span>Accuracy</span></div></div><div class="kpi"><div><b>${u.badges.length}</b><span>Badges ${u.badges.map(b => (GU.seed.badges.find(x => x.id === b.id) || {}).icon || '').join('')}</span></div></div>
        </div>
        <div class="grid-2"><div><h3 style="font-size:16px;margin-bottom:10px">Accuracy by category</h3>${cats.length ? bars(cats.map(x => ({ label: x.category.icon + ' ' + E(x.category.name), pct: x.accuracy, value: x.accuracy + '%', color: x.category.color }))) : '<p class="muted">No rounds yet.</p>'}</div>
        <div><h3 style="font-size:16px;margin-bottom:10px">Most missed topics</h3>${topics.map(t => `<div class="cat-line"><span class="ic" style="background:${t.category.color}1f">${t.category.icon}</span><div class="body"><b>${E(t.topic)}</b><span class="muted small">missed ${t.wrong}/${t.attempts}</span></div></div>`).join('') || '<p class="muted">None.</p>'}</div></div>`,
      footer: '<button class="btn btn-primary" data-close>Close</button>'
    });
  }

  /* ---------- GAME SESSIONS ---------- */
  GU.route('/a/sessions', () => {
    if (!guard()) return;
    const f = { search: '', cat: '', level: '', days: 30 };
    const c = shell('sessions', 'Game Sessions', `
      <div class="page-head"><div><h2 style="font-size:22px">Recorded game sessions</h2><p>Every finished round and every submitted answer is recorded.</p></div></div>
      <div class="panel">
        <div class="toolbar">
          <input class="input search" id="fs" placeholder="🔍 Search student…">
          <select class="input" id="fc">${catOptions('')}</select>
          <select class="input" id="fl"><option value="">All levels</option>${Object.entries(C.levels).map(([k, l]) => `<option value="${k}">${l.label}</option>`).join('')}</select>
          <select class="input" id="fd"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="0">All time</option></select>
        </div>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Student</th><th>Category</th><th>Level</th><th>Score</th><th>Correct</th><th>Accuracy</th><th>Time</th><th>Hints</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
        <div class="toolbar" style="border-top:1px solid var(--line);border-bottom:0"><span class="muted small" id="count"></span></div>
      </div>`);
    function draw() {
      const s = f.search.toLowerCase();
      const rows = GU.db.sessions.filter(periodFilter(f.days)).filter(x => {
        const u = GU.q.user(x.userId);
        return (!f.cat || x.categoryId === f.cat) && (!f.level || x.difficulty === f.level) && (!s || (u && u.name.toLowerCase().includes(s)));
      }).sort((a, b) => b.startedAt.localeCompare(a.startedAt));
      c.querySelector('#rows').innerHTML = rows.slice(0, 200).map(x => { const u = GU.q.user(x.userId); return `<tr>
        <td class="small" style="white-space:nowrap">${F.dateTime(x.startedAt)}</td>
        <td><b>${E(u ? u.name : 'Deleted user')}</b></td><td>${catPill(GU.q.category(x.categoryId))}</td><td>${levelPill(x.difficulty)}</td>
        <td><b>${x.totalScore}</b></td><td>${x.correct}/${x.total}</td><td>${accPill(x.accuracy)}</td><td class="small">${F.dur(x.timeSpent)}</td><td>${x.hintsUsed}</td>
        <td class="actions"><button class="btn btn-ghost btn-sm" data-v="${x.id}">Answers</button></td></tr>`; }).join('') || `<tr><td colspan="10"><div class="empty"><span class="e-ic">🎮</span>No sessions in this period.</div></td></tr>`;
      c.querySelector('#count').textContent = `${rows.length} session${rows.length === 1 ? '' : 's'}${rows.length > 200 ? ' (showing latest 200)' : ''}`;
      c.querySelectorAll('[data-v]').forEach(b => b.onclick = () => sessionDetail(GU.q.session(b.dataset.v)));
    }
    c.querySelector('#fs').oninput = e => { f.search = e.target.value; draw(); };
    c.querySelector('#fc').onchange = e => { f.cat = e.target.value; draw(); };
    c.querySelector('#fl').onchange = e => { f.level = e.target.value; draw(); };
    c.querySelector('#fd').onchange = e => { f.days = +e.target.value; draw(); };
    draw();
  });

  function sessionDetail(s) {
    const u = GU.q.user(s.userId), cat = GU.q.category(s.categoryId);
    GU.ui.modal({
      title: 'Session answers', size: 'lg',
      body: `<p class="muted" style="margin-top:-6px">${E(u ? u.name : '')} · ${cat ? cat.icon + ' ' + E(cat.name) : ''} · ${C.levels[s.difficulty].label} · ${F.dateTime(s.startedAt)} · <b>${s.totalScore} pts</b></p>
      <div class="table-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>#</th><th>Question</th><th>Submitted</th><th>Result</th><th>Time</th><th>Hint</th><th>Points</th></tr></thead><tbody>
      ${GU.q.answersOf(s.id).map((a, i) => { const q = GU.q.question(a.questionId); return `<tr><td>${i + 1}</td><td class="q-cell"><b title="${E(q ? q.question : '')}">${E(q ? q.question : '(deleted question)')}</b><span class="muted small">Answer: ${E(q ? q.answer : '')}</span></td><td>${E(a.submitted || '—')}</td><td>${a.correct ? '<span class="pill pill-ok">Correct</span>' : '<span class="pill pill-bad">Wrong</span>'}</td><td>${a.timeTaken}s</td><td>${a.hintUsed ? '💡' : '—'}</td><td><b>${a.points}</b></td></tr>`; }).join('')}
      </tbody></table></div>`,
      footer: '<button class="btn btn-primary" data-close>Close</button>'
    });
  }

  /* ---------- REPORTS ---------- */
  GU.route('/a/reports', () => {
    if (!guard()) return;
    const f = { days: 30, cat: '' };
    const c = shell('reports', 'Reports', `
      <div class="page-head"><div><h2 style="font-size:22px">Performance reports</h2><p>Player activity, average scores per category, and the items most frequently answered incorrectly.</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">
          <select class="input" id="fd" style="width:auto"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="0">All time</option></select>
          <select class="input" id="fc" style="width:auto">${catOptions('')}</select>
          <button class="btn btn-ghost" id="print">🖨 Print</button>
        </div></div>
      <div id="rep"></div>`);
    function data() {
      const ss = GU.db.sessions.filter(periodFilter(f.days)).filter(s => !f.cat || s.categoryId === f.cat);
      const ids = new Set(ss.map(s => s.id));
      return { ss, ans: GU.db.answers.filter(a => ids.has(a.sessionId)) };
    }
    function draw() {
      const { ss, ans } = data();
      const players = {};
      ss.forEach(s => { const p = players[s.userId] || (players[s.userId] = { u: GU.q.user(s.userId), rounds: 0, pts: 0, c: 0, t: 0, last: s.endedAt }); p.rounds++; p.pts += s.totalScore; p.c += s.correct; p.t += s.total; if (s.endedAt > p.last) p.last = s.endedAt; });
      const act = Object.values(players).filter(p => p.u).sort((a, b) => b.pts - a.pts);
      const cats = GU.stats.categoryStats(ss).filter(x => !f.cat || x.category.id === f.cat);
      const missed = GU.stats.missedItems(ans).slice(0, 15);
      const topics = GU.stats.missedTopics(ans).slice(0, 8);
      const acc = ans.length ? Math.round(ans.filter(a => a.correct).length / ans.length * 100) : 0;
      c.querySelector('#rep').innerHTML = `
        <div class="tiles-4">
          <div class="kpi"><span class="k-ic" style="background:#EDE9FE">👥</span><div><b>${act.length}</b><span>Active players</span></div></div>
          <div class="kpi"><span class="k-ic" style="background:#DCFCE7">🎮</span><div><b>${ss.length}</b><span>Rounds played</span></div></div>
          <div class="kpi"><span class="k-ic" style="background:#E0F2FE">✍️</span><div><b>${F.num(ans.length)}</b><span>Answers recorded</span></div></div>
          <div class="kpi"><span class="k-ic" style="background:#FEF3C7">🎯</span><div><b>${acc}%</b><span>Overall accuracy</span></div></div>
        </div>
        <div class="grid-2" style="margin-bottom:18px">
          <div class="panel"><div class="panel-head"><h3>Average score per category</h3><button class="btn btn-ghost btn-sm no-print" id="csvCat">⬇ CSV</button></div>
            <div class="table-wrap"><table class="tbl"><thead><tr><th>Category</th><th>Rounds</th><th>Avg score</th><th>Accuracy</th></tr></thead><tbody>
            ${cats.map(x => `<tr><td>${catPill(x.category)}</td><td>${x.rounds}</td><td><b>${x.rounds ? x.avgScore : '—'}</b></td><td>${x.rounds ? accPill(x.accuracy) : '—'}</td></tr>`).join('')}</tbody></table></div></div>
          <div class="panel"><div class="panel-head"><h3>Topics needing reteaching</h3></div>
            <div class="panel-body">${topics.length ? bars(topics.map(t => ({ label: t.category.icon + ' ' + E(t.topic), pct: t.rate, value: t.rate + '%', color: '#EF4444' }))) : '<p class="muted">No data for this period.</p>'}<p class="muted small" style="margin-top:10px">Percent of answers that were wrong, per topic.</p></div></div>
        </div>
        <div class="panel" style="margin-bottom:18px"><div class="panel-head"><h3>Items most frequently answered incorrectly</h3><button class="btn btn-ghost btn-sm no-print" id="csvMiss">⬇ CSV</button></div>
          <div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>Question</th><th>Category</th><th>Type</th><th>Level</th><th>Attempts</th><th>Wrong</th><th>Wrong rate</th></tr></thead><tbody>
          ${missed.map((m, i) => `<tr><td>${i + 1}</td><td class="q-cell"><b title="${E(m.question.question)}">${E(m.question.question)}</b><span class="muted small">Answer: ${E(m.question.answer)}</span></td><td>${catPill(GU.q.category(m.question.categoryId))}</td><td class="small">${C.types[m.question.type].label}</td><td>${levelPill(m.question.difficulty)}</td><td>${m.attempts}</td><td>${m.wrong}</td><td><span class="pill pill-bad">${m.rate}%</span></td></tr>`).join('') || '<tr><td colspan="8" class="muted">No data for this period.</td></tr>'}
          </tbody></table></div></div>
        <div class="panel"><div class="panel-head"><h3>Player activity</h3><button class="btn btn-ghost btn-sm no-print" id="csvAct">⬇ CSV</button></div>
          <div class="table-wrap"><table class="tbl"><thead><tr><th>Rank</th><th>Student</th><th>Year</th><th>Rounds</th><th>Points</th><th>Accuracy</th><th>Last played</th></tr></thead><tbody>
          ${act.map((p, i) => `<tr><td>${i + 1}</td><td><div class="user-cell"><span class="avatar">${F.initials(p.u.name)}</span><div><b>${E(p.u.name)}</b><span>${E(p.u.email)}</span></div></div></td><td>${E(p.u.yearLevel || '—')}</td><td>${p.rounds}</td><td><b>${F.num(p.pts)}</b></td><td>${accPill(Math.round(p.c / p.t * 100))}</td><td class="small muted">${F.date(p.last)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No data for this period.</td></tr>'}
          </tbody></table></div></div>`;
      const period = f.days ? `last${f.days}days` : 'alltime';
      c.querySelector('#csvCat').onclick = () => GU.ui.csv(`guessup_category_report_${period}.csv`, [['Category', 'Rounds', 'Average score', 'Accuracy %']].concat(cats.map(x => [x.category.name, x.rounds, x.avgScore, x.accuracy])));
      c.querySelector('#csvMiss').onclick = () => GU.ui.csv(`guessup_most_missed_${period}.csv`, [['Question', 'Answer', 'Category', 'Topic', 'Type', 'Level', 'Attempts', 'Wrong', 'Wrong %']].concat(missed.map(m => [m.question.question, m.question.answer, (GU.q.category(m.question.categoryId) || {}).name, m.question.topic, C.types[m.question.type].label, C.levels[m.question.difficulty].label, m.attempts, m.wrong, m.rate])));
      c.querySelector('#csvAct').onclick = () => GU.ui.csv(`guessup_player_activity_${period}.csv`, [['Rank', 'Student', 'Email', 'Year', 'Rounds', 'Points', 'Accuracy %', 'Last played']].concat(act.map((p, i) => [i + 1, p.u.name, p.u.email, p.u.yearLevel, p.rounds, p.pts, Math.round(p.c / p.t * 100), F.date(p.last)])));
    }
    c.querySelector('#fd').onchange = e => { f.days = +e.target.value; draw(); };
    c.querySelector('#fc').onchange = e => { f.cat = e.target.value; draw(); };
    c.querySelector('#print').onclick = () => window.print();
    draw();
  });
})();

</script>
</body>
</html>
